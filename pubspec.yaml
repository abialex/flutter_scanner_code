name: flutter_scanner_code
description: Windows keyboard input capture and device listing for Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: ScannerCodePlugin
